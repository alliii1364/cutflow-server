services:
  # ── NestJS API ────────────────────────────────────────────────────────────
  - type: web
    name: cutflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon          # change to your preferred region
    plan: starter           # upgrade to standard for production
    healthCheckPath: /v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Automatically wired from the Render PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: cutflow-db
          property: connectionString

      # Automatically wired from the Render Redis instance below
      - key: REDIS_URL
        fromService:
          name: cutflow-redis
          type: redis
          property: connectionString

      # Set these manually in the Render dashboard:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d

      # Your Vercel production URL (e.g. https://cutflow.vercel.app)
      # Vercel preview URLs (*.vercel.app) are allowed automatically.
      - key: FRONTEND_URL
        sync: false

      # Google OAuth — set in dashboard if using Google login
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match: https://<your-render-slug>.onrender.com/v1/auth/google/callback
      - key: GOOGLE_CALLBACK_URL
        sync: false

      # Stripe — set in dashboard if using payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # AWS S3 — set in dashboard if using file uploads
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET_NAME
        value: cutflow-media

      # OpenAI — set in dashboard if using AI features
      - key: OPENAI_API_KEY
        sync: false

      # SendGrid — set in dashboard if using email
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: noreply@cutflow.app

      # ElevenLabs / Replicate — optional
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: cutflow-redis
    region: oregon
    plan: starter           # upgrade for production persistence
    maxmemoryPolicy: noeviction

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  - name: cutflow-db
    region: oregon
    plan: starter           # upgrade for production backups
    databaseName: cutflow
    user: cutflow
